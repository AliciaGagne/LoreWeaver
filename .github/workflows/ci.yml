name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Executer les tests JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code du repository
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Executer les tests
        run: npm test
